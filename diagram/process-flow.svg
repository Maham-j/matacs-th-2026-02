<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980"><rect width="800" height="980" fill="white"/><g font-family="Arial,sans-serif" fill="#111" text-anchor="middle"><text x="400" y="40" font-size="24" font-weight="bold">AI Proposal Triage — Process Flow</text><g stroke="#222" stroke-width="1.5" fill="white"><rect x="100" y="70" width="600" height="74"/><rect x="100" y="190" width="600" height="74"/><rect x="100" y="310" width="600" height="74"/><rect x="100" y="430" width="600" height="74"/><rect x="100" y="550" width="600" height="74"/><rect x="100" y="670" width="600" height="74"/><rect x="100" y="790" width="600" height="74"/><path d="M400 144v46m-6-7 6 7 6-7 M400 264v46m-6-7 6 7 6-7 M400 384v46m-6-7 6 7 6-7 M400 504v46m-6-7 6 7 6-7 M400 624v46m-6-7 6 7 6-7 M400 744v46m-6-7 6 7 6-7"/></g><g font-size="17" font-weight="bold"><text x="400" y="100">1. Upload proposals</text><text x="400" y="220">2. Extract facts with AI</text><text x="400" y="340">3. Check extracted data</text><text x="400" y="460">4. Check mandatory requirements</text><text x="400" y="580">5. Score eligible proposals</text><text x="400" y="700">6. Show ranking and warnings</text><text x="400" y="820">7. Human makes final decision</text></g><g font-size="14"><text x="400" y="124">Save original files</text><text x="400" y="244">Keep evidence and missing fields</text><text x="400" y="364">Reviewer corrects uncertain facts</text><text x="400" y="484">Pass / fail / needs review</text><text x="400" y="604">Apply configured weights</text><text x="400" y="724">Show scores and supporting evidence</text><text x="400" y="844">Resolve flags before award</text><text x="400" y="910">Missing information is flagged, never guessed.</text><text x="400" y="934">If AI processing fails, retain files and retry safely.</text></g></g></svg>